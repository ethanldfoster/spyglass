[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spyglass"
version = "0.1.0"
description = "Track the S&P 500 with a handful of stocks, picked by simulated annealing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Foster" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel", "nbformat", "nbconvert"]

[project.scripts]
spyglass = "spyglass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
